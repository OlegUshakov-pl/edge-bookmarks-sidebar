<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <!-- Top: + (add current page) -->
    <button id="add-current-btn" class="icon-btn" title="Add current page">
      <i class="fa-solid fa-plus text-lg"></i>
    </button>

    <!-- Collapsed mode: icons only -->
    <div id="collapsed-icons"></div>

    <!-- Expanded mode -->
    <div id="expanded-area">
      <div id="bookmarks-list"></div>

      <!-- + button at the bottom of the list -->
      <button id="add-manual-btn" title="Add bookmark">
        <i class="fa-solid fa-plus"></i>
      </button>

      <!-- Manual add form -->
      <div id="add-form">
        <input type="text" id="add-title" placeholder="Title">
        <input type="url" id="add-url" placeholder="https://">
        <div class="actions">
          <button id="save-btn">Save</button>
          <button id="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Bottom: expand button -->
    <div class="border-t border-gray-100">
      <button id="toggle-btn" class="icon-btn w-full" title="Expand / collapse">
        <i id="toggle-icon" class="fa-solid fa-chevron-right text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Context menu (right-click) -->
  <div id="context-menu">
    <button id="ctx-edit"><i class="fa-solid fa-pen"></i> Edit</button>
    <button id="ctx-delete" class="danger"><i class="fa-solid fa-trash"></i> Delete</button>
  </div>

  <!-- Edit modal -->
  <div id="edit-modal">
    <div id="edit-box">
      <input type="text" id="edit-title" placeholder="Title">
      <input type="url" id="edit-url" placeholder="https://">
      <div class="actions">
        <button id="edit-save" style="background:#1a73e8;color:white">OK</button>
        <button id="edit-cancel" style="background:#f3f4f6;color:#4b5563">Cancel</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
